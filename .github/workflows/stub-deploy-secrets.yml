name: stub-deploy-secrets
# Stand-in for Arthvit/gs-deployment-workflows deploy-secrets.yml. Prints only, deploys nothing.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      service_name:
        required: true
        type: string
      namespace:
        required: false
        default: default
        type: string

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Would apply ExternalSecret
        env:
          FILE: deploy/${{ inputs.service_name }}/${{ inputs.environment }}/secrets.yaml
        run: |
          echo "STUB deploy-secrets"
          echo "environment : ${{ inputs.environment }}"
          echo "secret      : ${{ inputs.service_name }}-k8s-secret (ns ${{ inputs.namespace }})"
          echo "file hash   : $(sha256sum "$FILE" | cut -c1-16)"
